name: Update VPN Detection Database

on:
  schedule:
    - cron: '0 2 * * *'    # Every day at 02:00 UTC
  workflow_dispatch:         # Allow manual trigger from the GitHub UI

permissions:
  contents: write            # Required to create/update GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Build the database ────────────────────────────────────────────────
      - name: Build VPN detection full database
        run: python build_full_db.py

      # ── 4. Verify the output ─────────────────────────────────────────────────
      - name: Verify database integrity
        run: |
          python3 - <<'EOF'
          import sqlite3, sys, os
          path = "vpn_detection_full.db"
          # File must exist and be non-empty
          if not os.path.exists(path):
              print("ERROR: database file not found")
              sys.exit(1)
          conn = sqlite3.connect(path)
          # Quick integrity check
          result = conn.execute("PRAGMA integrity_check").fetchone()[0]
          if result != "ok":
              print(f"ERROR: integrity_check failed — {result}")
              sys.exit(1)
          # Row counts
          total = conn.execute("SELECT COUNT(*) FROM ip_ranges").fetchone()[0]
          by_type = conn.execute(
              "SELECT type, COUNT(*) FROM ip_ranges GROUP BY type ORDER BY type"
          ).fetchall()
          built_at = conn.execute(
              "SELECT value FROM meta WHERE key='built_at'"
          ).fetchone()[0]
          print(f"Built at      : {built_at}")
          print(f"Total ranges  : {total:,}")
          for t, c in by_type:
              print(f"  {t:<12}: {c:,}")
          if total < 1000:
              print("ERROR: too few ranges — aborting release")
              sys.exit(1)
          conn.close()
          print("Verification passed ✓")
          EOF

      # ── 5. Publish as a rolling 'vpn-latest' release ─────────────────────────
      #
      #  Strategy: delete + recreate the 'vpn-latest' tag/release on every run.
      #  Using a dedicated tag prevents this workflow from wiping the
      #  GeoLite2-ASN.mmdb asset managed by the ASN workflow.
      #
      #  Stable download URL (never changes):
      #    https://github.com/YOUR_USERNAME/YOUR_REPO/releases/download/vpn-latest/vpn_detection.db
      #
      - name: Delete existing 'vpn-latest-full' release (if any)
        run: gh release delete vpn-latest-full --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new 'vpn-latest-full' release
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          gh release create vpn-latest-full vpn_full_detection.db \
            --title "VPN Detection Full Database — ${DATE}" \
            --notes "$(cat <<'NOTES'
          ## Auto-updated daily at 02:00 UTC
          ### Included sources
          | Source | Type |
          |---|---|
          | [X4BNet VPN list](https://github.com/X4BNet/lists_vpn) | Commercial VPN ranges |
          | [Tor Project](https://check.torproject.org/torbulkexitlist) | Tor exit nodes |
          | [ipcat_datacenter](https://raw.githubusercontent.com/client9/ipcat/master/datacenters.csv) | Datacenter / hosting IPs |
          | [Stamparm ipsum level 3](https://github.com/stamparm/ipsum) | Open proxies |
          ### Download
          ```
          https://github.com/YOUR_USERNAME/YOUR_REPO/releases/download/vpn-latest-full/vpn_detection_full.db
          ```
          NOTES
          )" \
            --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
